<!DOCTYPE html>
<html lang="zh-TW" data-house="gryffindor">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE BOYZ 霍格華茲模擬器</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161920;
            --text-main: #e0e0e0;
            --text-dim: #8b949e;
            --border-color: #262a33;
            --user-msg-bg: #1f2c3f;
            --npc-msg-bg: #1a1e29;
            
            --accent-primary: #740001;
            --accent-secondary: #d3a625;
            --accent-border: #ae0001;
        }

        html[data-house="gryffindor"] {
            --accent-primary: #740001;
            --accent-secondary: #d3a625;
            --accent-border: #ae0001;
        }
        html[data-house="slytherin"] {
            --accent-primary: #1a472a;
            --accent-secondary: #aaaaaa;
            --accent-border: #2a623d;
        }
        html[data-house="ravenclaw"] {
            --accent-primary: #0e1a40;
            --accent-secondary: #946b2d;
            --accent-border: #222f5b;
        }
        html[data-house="hufflepuff"] {
            --accent-primary: #ecb939;
            --accent-secondary: #372e29;
            --accent-border: #f0c75e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        #app-wrapper {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* 手機頂部標題欄 */
        #header {
            height: 54px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        #header h1 {
            font-size: 1.05rem;
            margin: 0;
            color: var(--accent-secondary);
            font-weight: 600;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            width: auto;
            margin: 0;
        }

        /* 側邊抽屜選單 */
        #sidebar-drawer {
            position: absolute;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 320px;
            height: 100%;
            background-color: var(--card-bg);
            z-index: 200;
            transition: left 0.3s ease;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
        }

        #sidebar-drawer.open {
            left: 0;
        }

        #drawer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 150;
            display: none;
        }

        #drawer-overlay.show {
            display: block;
        }

        #sidebar-drawer h2, #sidebar-drawer h3 {
            color: var(--accent-secondary);
            margin-top: 0;
            border-bottom: 1px solid var(--accent-border);
            padding-bottom: 8px;
            font-size: 1rem;
        }

        .panel-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        input, select, button {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            background: #0d0f12;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        button {
            background-color: var(--accent-primary);
            color: #fff;
            border: 1px solid var(--accent-border);
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn-group {
            display: flex;
            gap: 8px;
        }

        .save-btn-group button {
            flex: 1;
        }

        .stat-box {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-secondary);
        }

        .stat-title {
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .stat-desc {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-top: 6px;
        }

        /* 聊天主區域 */
        #chat-window {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 90%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.npc {
            align-self: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--accent-secondary);
            flex-shrink: 0;
        }

        .msg-content {
            background-color: var(--npc-msg-bg);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            line-height: 1.5;
            font-size: 0.88rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .msg-content {
            background-color: var(--user-msg-bg);
        }

        .msg-sender {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .delta-tag {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 0.7rem;
            margin-left: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--accent-secondary);
            border: 1px solid var(--accent-border);
        }

        /* 輸入與選項區域 */
        #input-container {
            padding: 12px 16px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #options-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .opt-btn {
            width: 100%;
            background: #1c202b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-weight: normal;
            text-align: left;
            padding: 10px 12px;
            font-size: 0.82rem;
            margin-bottom: 0;
            border-radius: 6px;
        }

        .opt-btn:active {
            background: #252a38;
            border-color: var(--accent-secondary);
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .input-row input {
            margin-bottom: 0;
            flex: 1;
        }

        .input-row button {
            width: 80px;
            margin-bottom: 0;
            flex-shrink: 0;
        }

        #setup-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            padding: 16px;
        }

        .setup-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--accent-secondary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- 頁首與側邊欄開關 -->
        <div id="header">
            <button class="icon-btn" onclick="toggleDrawer()">☰</button>
            <h1>霍格華茲模擬器</h1>
            <div style="width: 24px;"></div>
        </div>

        <!-- 側邊欄抽屜面板 -->
        <div id="drawer-overlay" onclick="toggleDrawer()"></div>
        <div id="sidebar-drawer">
            <h2>功能選單</h2>
            
            <div class="panel-section">
                <h3>學院主題</h3>
                <select id="theme-select" onchange="changeTheme(this.value)">
                    <option value="gryffindor">葛萊分多 (Gryffindor)</option>
                    <option value="slytherin">史萊哲林 (Slytherin)</option>
                    <option value="ravenclaw">雷文克勞 (Ravenclaw)</option>
                    <option value="hufflepuff">赫夫帕夫 (Hufflepuff)</option>
                </select>
            </div>

            <div class="panel-section">
                <h3>存檔管理</h3>
                <div class="save-btn-group">
                    <button onclick="saveGame()">儲存進度</button>
                    <button onclick="loadGame()">讀取進度</button>
                </div>
                <button onclick="clearSave()" style="background:#5a1818; margin-top:6px;">清除本地存檔</button>
            </div>

            <div class="panel-section">
                <h3>玩家資料</h3>
                <div id="player-summary" style="font-size: 0.8rem; color: var(--text-dim);">尚未設定角色...</div>
            </div>

            <div class="panel-section">
                <h3>攻略對象狀態</h3>
                <div id="target-stats">
                    <div style="font-size:0.8rem; color:#666;">尚未開始遊戲...</div>
                </div>
            </div>

            <button onclick="toggleDrawer()" style="background:#333; border-color:#555; margin-top:10px;">關閉選單</button>
        </div>

        <!-- 聊天主視窗 -->
        <div id="chat-window"></div>

        <!-- 下方操作區 -->
        <div id="input-container">
            <div id="options-container"></div>
            <div class="input-row">
                <input type="text" id="custom-input" placeholder="輸入自由發揮行動..." onkeypress="if(event.key==='Enter') sendCustomAction()">
                <button onclick="sendCustomAction()">發送</button>
            </div>
        </div>

        <!-- 角色卡建立彈窗 -->
        <div id="setup-overlay">
            <div class="setup-card">
                <h2 style="color:var(--accent-secondary); margin-top:0; font-size:1.1rem;">建立角色卡</h2>
                
                <label>姓名（含英文）</label>
                <input type="text" id="init-name" value="秈萱 (Xuan)">

                <div class="grid-2">
                    <div>
                        <label>年級</label>
                        <select id="init-year">
                            <option value="5年級">5年級</option>
                            <option value="6年級" selected>6年級</option>
                            <option value="7年級">7年級</option>
                        </select>
                    </div>
                    <div>
                        <label>血統</label>
                        <select id="init-blood">
                            <option value="純血">純血</option>
                            <option value="混血">混血</option>
                            <option value="麻瓜出身">麻瓜出身</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>學院</label>
                        <select id="init-house" onchange="syncHouseTheme(this.value)">
                            <option value="葛萊分多">葛萊分多</option>
                            <option value="史萊哲林">史萊哲林</option>
                            <option value="雷文克勞">雷文克勞</option>
                            <option value="赫夫帕夫">赫夫帕夫</option>
                        </select>
                    </div>
                    <div>
                        <label>攻略對象</label>
                        <select id="init-target">
                            <option value="金善旴 (Sunwoo)">金善旴 (Sunwoo)</option>
                            <option value="孫英宰 (Eric)">孫英宰 (Eric)</option>
                            <option value="李柱延 (Juyeon)">李柱延 (Juyeon)</option>
                            <option value="金泳勳 (Younghoon)">金泳勳 (Younghoon)</option>
                            <option value="李賢在 (Hyunjae)">李賢在 (Hyunjae)</option>
                        </select>
                    </div>
                </div>

                <label>與攻略對象關係</label>
                <select id="init-rel">
                    <option value="普通同學">普通同學</option>
                    <option value="陌生人">陌生人</option>
                    <option value="青梅竹馬">青梅竹馬</option>
                    <option value="死對頭">死對頭</option>
                    <option value="未婚夫妻">未婚夫妻</option>
                </select>

                <div class="grid-2">
                    <div>
                        <label>男性競爭者</label>
                        <select id="init-male-comp">
                            <option value="否">否</option>
                            <option value="是">是</option>
                        </select>
                    </div>
                    <div>
                        <label>女性競爭者</label>
                        <select id="init-female-comp">
                            <option value="否">否</option>
                            <option value="是">是</option>
                        </select>
                    </div>
                </div>

                <label>玩家頭像 URL</label>
                <input type="text" id="init-avatar" value="https://api.dicebear.com/7.x/bottts/svg?seed=Xuan">

                <label>起始節點</label>
                <select id="init-node">
                    <option value="選項A：霍格華茲特快車（開學前）">選項A：霍格華茲特快車（開學前）</option>
                    <option value="選項B：開學首日（霍格華茲校內）">選項B：開學首日（霍格華茲校內）</option>
                </select>

                <button onclick="submitCharacterSetup()">確認並開始遊戲</button>
            </div>
        </div>
    </div>

    <script>
        const NPC_AVATARS = {
            "金善旴 (Sunwoo)": "sunwoo.png",
            "孫英宰 (Eric)": "eric.png",
            "李柱延 (Juyeon)": "juyeon.png",
            "金泳勳 (Younghoon)": "younghoon.png",
            "李賢在 (Hyunjae)": "hyunjae.png",
            "旁白/系統": "hogwarts.png"
        };

        let gameState = {
            player: {},
            target: {
                name: "",
                favor: 0,
                favorDelta: "+0%",
                thought: "尚無",
                period: "開學季"
            },
            turnCount: 0,
            chatMessages: [],
            currentOptions: [],
            currentTheme: "gryffindor"
        };

        function toggleDrawer() {
            const drawer = document.getElementById('sidebar-drawer');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-house', themeName);
            gameState.currentTheme = themeName;
            document.getElementById('theme-select').value = themeName;
        }

        function syncHouseTheme(houseZh) {
            const houseMap = {
                '葛萊分多': 'gryffindor',
                '史萊哲林': 'slytherin',
                '雷文克勞': 'ravenclaw',
                '赫夫帕夫': 'hufflepuff'
            };
            if (houseMap[houseZh]) {
                changeTheme(houseMap[houseZh]);
            }
        }

        function saveGame() {
            if (!gameState.player.name) {
                alert("尚未建立角色！");
                return;
            }
            localStorage.setItem('hogwarts_tbz_save', JSON.stringify({ gameState }));
            alert("進度已儲存！");
            toggleDrawer();
        }

        function loadGame() {
            const savedStr = localStorage.getItem('hogwarts_tbz_save');
            if (!savedStr) {
                alert("查無本地存檔！");
                return;
            }
            try {
                const parsed = JSON.parse(savedStr);
                gameState = parsed.gameState;
                
                changeTheme(gameState.currentTheme || 'gryffindor');

                document.getElementById('player-summary').innerHTML = `
                    <b>姓名：</b>${gameState.player.name}<br>
                    <b>學院/年級：</b>${gameState.player.house} / ${gameState.player.year}<br>
                    <b>血統：</b>${gameState.player.blood}<br>
                    <b>攻略對象：</b>${gameState.player.target}<br>
                    <b>初始關係：</b>${gameState.player.rel}
                `;

                if (gameState.target && gameState.target.name) {
                    renderStatsPanel(gameState.target);
                }

                document.getElementById('chat-window').innerHTML = '';
                if (gameState.chatMessages && gameState.chatMessages.length > 0) {
                    gameState.chatMessages.forEach(msg => {
                        renderMessageDOM(msg.sender, msg.text, msg.avatarUrl, msg.type, msg.delta);
                    });
                }

                renderOptions(gameState.currentOptions || []);
                document.getElementById('setup-overlay').style.display = 'none';

                alert("成功讀取存檔！");
                toggleDrawer();
            } catch (e) {
                alert("讀取存檔失敗。");
            }
        }

        function clearSave() {
            if (confirm("確定要清除本地存檔嗎？")) {
                localStorage.removeItem('hogwarts_tbz_save');
                alert("存檔已清除。");
                toggleDrawer();
            }
        }

        function submitCharacterSetup() {
            gameState.player = {
                name: document.getElementById('init-name').value,
                year: document.getElementById('init-year').value,
                blood: document.getElementById('init-blood').value,
                house: document.getElementById('init-house').value,
                target: document.getElementById('init-target').value,
                rel: document.getElementById('init-rel').value,
                maleComp: document.getElementById('init-male-comp').value,
                femaleComp: document.getElementById('init-female-comp').value,
                avatar: document.getElementById('init-avatar').value,
                startNode: document.getElementById('init-node').value
            };

            gameState.target.name = gameState.player.target;
            syncHouseTheme(gameState.player.house);

            document.getElementById('player-summary').innerHTML = `
                <b>姓名：</b>${gameState.player.name}<br>
                <b>學院/年級：</b>${gameState.player.house} / ${gameState.player.year}<br>
                <b>血統：</b>${gameState.player.blood}<br>
                <b>攻略對象：</b>${gameState.player.target}<br>
                <b>初始關係：</b>${gameState.player.rel}
            `;

            document.getElementById('setup-overlay').style.display = 'none';
            generateNextTurn("開始遊戲");
        }

        function generateNextTurn(actionText) {
            if (actionText !== "開始遊戲") {
                appendMessage(gameState.player.name, actionText, gameState.player.avatar, 'user');
            }

            gameState.turnCount++;
            
            setTimeout(() => {
                let deltaVal = (actionText === "開始遊戲") ? 0 : Math.floor(Math.random() * 4) + 1;
                gameState.target.favor += deltaVal;
                let deltaStr = deltaVal > 0 ? `+${deltaVal}%` : `+0%`;

                let stories = [
                    `你確認了自己的身份：${gameState.player.name}，屬於${gameState.player.house}學院的${gameState.player.year}學生。此時你正處於${gameState.player.startNode}的場景中。\n\n周圍的人聲喧囂，霍格華茲特快車的蒸汽車輪開始轟鳴運轉。你抬頭看向車廂走廊，正好瞥見了${gameState.player.target}經過。他的目光在你的院徽上記錄了片刻，眼神中帶著一絲疏離與審視。\n\n「又是一個新學期。」他低聲自語了一句，隨手理了理袍角，並沒有主動向你搭話，但你知道，你們的交集才剛剛開始。`,
                    
                    `你選擇了行動：『${actionText}』。\n\n過道上的風吹過，${gameState.player.target}微微停下了腳步。他轉過頭看向你，眉頭稍微挑了挑。對於身為${gameState.player.house}、並且血統為${gameState.player.blood}的你，他似乎有一套屬於自己的判斷標準。\n\n「既然你這麼說了，」他聲音平淡，卻帶著幾分藏不住的興味，「這學期最好別在課堂上給我添麻煩。」他說完便轉身離去，但眼神顯然比剛才多逗留了幾秒。`,
                    
                    `隨著對話推進，城堡 corridor 的壁畫正在低聲討論著你們。${gameState.player.target}靠在牆邊，雙手環胸看著你。對於你剛剛『${actionText}』的舉動，他顯得有些出乎意料。\n\n「你平時都是這麼直截了當的嗎？」他嘴角扯起一抹難以察覺的弧度。雖然表面上依然保持著距離感，但他看向你的眼神已經沒有最初那麼冷漠了。`
                ];

                let idx = Math.min(gameState.turnCount - 1, stories.length - 1);
                let textRes = stories[idx] || `你對${gameState.player.target}執行了行動：『${actionText}』。\n\n霍格華茲的長廊上傳來腳步聲。${gameState.player.target}停下動作看向你，眼神裡多了一分耐人尋味的意味。雖然你們目前的關係依然是${gameState.player.rel}，但隨着互動增加，某種微妙的變化正漸漸在你們之間發酵。`;

                let thoughts = [
                    "這傢伙也是這個年級的？希望這學期別太麻煩。",
                    "剛才那舉動……倒是比其他人有趣一些。",
                    "稍微有點意思了，再觀察看看吧。"
                ];

                let responseObj = {
                    sender: gameState.player.target,
                    text: textRes,
                    stats: {
                        targetName: gameState.player.target,
                        favor: gameState.target.favor,
                        favorDelta: deltaStr,
                        thought: thoughts[Math.min(gameState.turnCount - 1, thoughts.length - 1)] || "對你的注意力逐漸增加。",
                        period: "學期進行中"
                    },
                    options: [
                        "主動邀請他一起去霍格華茲村",
                        "保持距離，冷靜地回覆他的話",
                        "拿出魔咒課本請教他問題"
                    ]
                };

                const avatar = NPC_AVATARS[responseObj.sender] || NPC_AVATARS["旁白/系統"];
                appendMessage(responseObj.sender, responseObj.text, avatar, 'npc', responseObj.stats.favorDelta);

                gameState.target = responseObj.stats;
                renderStatsPanel(responseObj.stats);

                gameState.currentOptions = responseObj.options;
                renderOptions(responseObj.options);

                localStorage.setItem('hogwarts_tbz_save', JSON.stringify({ gameState }));
            }, 300);
        }

        function renderStatsPanel(stats) {
            document.getElementById('target-stats').innerHTML = `
                <div class="stat-box">
                    <div class="stat-title">
                        <span>${stats.targetName}</span>
                        <span>好感度: ${stats.favor}% (${stats.favorDelta})</span>
                    </div>
                    <div class="stat-desc"><b>當前狀態：</b>${stats.period}</div>
                    <div class="stat-desc"><b>內心想法：</b>${stats.thought}</div>
                </div>
            `;
        }

        function appendMessage(sender, text, avatarUrl, type, delta = null) {
            if (!gameState.chatMessages) gameState.chatMessages = [];
            gameState.chatMessages.push({ sender, text, avatarUrl, type, delta });
            renderMessageDOM(sender, text, avatarUrl, type, delta);
        }

        function renderMessageDOM(sender, text, avatarUrl, type, delta) {
            const chatWin = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;

            let deltaHtml = delta ? `<span class="delta-tag">好感度 ${delta}</span>` : '';

            msgDiv.innerHTML = `
                <img class="avatar" src="${avatarUrl}" alt="${sender}">
                <div>
                    <div class="msg-sender">${sender} ${deltaHtml}</div>
                    <div class="msg-content">${text}</div>
                </div>
            `;

            chatWin.appendChild(msgDiv);
            chatWin.scrollTop = chatWin.scrollHeight;
        }

        function renderOptions(options) {
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            if (options && options.length > 0) {
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.innerText = opt;
                    btn.onclick = () => generateNextTurn(opt);
                    optContainer.appendChild(btn);
                });
            }
        }

        function sendCustomAction() {
            const input = document.getElementById('custom-input');
            const val = input.value.trim();
            if (val) {
                generateNextTurn(val);
                input.value = '';
            }
        }

        window.onload = () => {
            if (localStorage.getItem('hogwarts_tbz_save')) {
                console.log("發現本地存檔。");
            }
        };
    </script>
</body>
</html>
